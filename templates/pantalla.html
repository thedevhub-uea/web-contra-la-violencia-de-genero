{# Pantalla proyectada. Esqueleto común: cada tarea rellena SOLO su parte.
   T04: rotación de vistas · T07: mural · T08: vídeo · T09: foro · T10: QR y estilos #}
<!doctype html>
<html lang="{{ idioma_actual }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>25N · {{ _('Pantalla') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/paleta.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/conecta.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/burbuja-estilo.css') }}">
</head>
<body class="pantalla" data-api-mural="{{ url_for('api_mural') }}" data-api-foro="{{ url_for('api_foro') }}"
      data-api-control="{{ url_for('api_pantalla') }}"
      data-textos='{{ {
        "pantalla_completa": _("Pantalla completa (o pulsa F11)"),
        "pulsa_f11": _("Pulsa F11 para pantalla completa"),
        "video_titulo": _("Día Internacional para la Eliminación de la Violencia contra la Mujer"),
        "video_creditos": _("Cortometraje de %(autora)s", autora="zoila electra · @zoilaelectra"),
      } | tojson }}'>
  <!-- T07: mural de burbujas -->
  <section id="vista-mural" class="vista"></section>

  <!-- T08: vídeo -->
  <section id="vista-video" class="vista" hidden>
    <video id="video25n" src="{{ url_for('static', filename='video/video.mp4') }}" playsinline></video>
  </section>

  <!-- T09: foro -->
  <section id="vista-foro" class="vista" hidden></section>

  <!-- QR fijo abajo a la derecha, visible en las tres vistas. Va DIBUJADO en la imagen de fondo
       (img/conecta/pantalla_fondo_qr.png, con el lema «Leave your message / Deja tu mensaje»);
       este elemento es solo una «ventana» encima para que nada lo tape (ver #qr en estilos.css). -->
  <aside id="qr" role="img" aria-label="{{ _('Código QR para participar') }}"></aside>

  <!-- Transición entre vistas / pantalla de inicio: la portada (con QR y logos dibujados) y la etiqueta
       «Siguiente». .trans-escena mide lo mismo que la imagen, así lo de dentro se coloca en % de la imagen. -->
  <div id="transicion-pantalla" aria-hidden="true">
    <div class="trans-escena">
      <div class="trans-lienzo">
        <img src="{{ url_for('static', filename='img/conecta/pantalla_portada_qr.png') }}" alt="">
        <span class="trans-destello"></span>
      </div>
      <p class="trans-etiqueta panel-conecta" hidden><span class="es"></span> <span aria-hidden="true">/</span> <span class="en"></span></p>
      <div class="trans-progreso"><span></span></div>
      <p class="trans-cuenta"></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/estilo-burbuja.js') }}"></script>
  <script src="{{ url_for('static', filename='js/mural.js') }}"></script>
  <script src="{{ url_for('static', filename='js/video.js') }}"></script>
  <script src="{{ url_for('static', filename='js/foro.js') }}"></script>
  <!-- T04: va el último porque usa pintarMural, pintarForo, iniciarVideo y pararVideo -->
  <script src="{{ url_for('static', filename='js/pantalla.js') }}"></script>
  {% include '_logos.html' %}
</body>
</html>
